name: Refresh GitAnimals artwork

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh theme-aware farm images
        run: node scripts/refresh-gitanimals.mjs

      - name: Verify coordinated movement and collision recovery
        run: node scripts/verify-gitanimals-layout.mjs

      - name: Commit meaningful GitAnimals changes
        run: |
          if git diff --quiet; then
            echo "GitAnimals state is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gitanimals
          git commit -m "chore: refresh GitAnimals artwork"
          git push
