name: GitAnimals refresh watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent fallback slots. If the primary :07/:37 trigger is delayed or dropped,
    # this path gets another chance 15 minutes later.
    - cron: "22,52 * * * *"

concurrency:
  group: gitanimals-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-if-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check GitAnimals and refresh stale artwork
        run: node scripts/refresh-gitanimals.mjs

      - name: Verify coordinated movement and collision recovery
        run: node scripts/verify-gitanimals-layout.mjs

      - name: Commit watchdog recovery when needed
        run: |
          if git diff --quiet; then
            echo "GitAnimals artwork is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/gitanimals
          git commit -m "chore: recover stale GitAnimals artwork"
          git pull --rebase origin main
          git push
