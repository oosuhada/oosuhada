name: Render stack timeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - assets/stack/stack-timeline.json
      - scripts/render-stack-timeline.mjs

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render light and dark SVGs
        run: node scripts/render-stack-timeline.mjs

      - name: Commit changed artwork
        run: |
          if git diff --quiet -- assets/stack/stack-timeline-light.svg assets/stack/stack-timeline-dark.svg; then
            echo "Stack timeline artwork is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stack/stack-timeline-light.svg assets/stack/stack-timeline-dark.svg
          git commit -m "chore: refresh stack timeline artwork"
          git push
